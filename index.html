    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase state setup
        window.db = null;
        window.auth = null;
        window.currentUser = null;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'garak-safety-jump';
        window.appId = appId;

        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                window.db = getFirestore(app);
                window.auth = getAuth(app);

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            const res = await signInWithCustomToken(window.auth, __initial_auth_token);
                            window.currentUser = res.user;
                        } else {
                            const res = await signInAnonymously(window.auth);
                            window.currentUser = res.user;
                        }
                        if (window.onCloudReady) window.onCloudReady();
                    } catch (e) {
                        console.warn("Auth initialization failed:", e);
                    }
                };
                initAuth();
            }
        } catch (e) {
            console.warn("Firebase config error:", e);
        }
    </script>

    <!-- GAME LOGIC -->
    <script>
        // --- SOUND ENGINE ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(550, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playCorrect() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.2);
                });
            }

            playWrong() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [400, 350, 300, 220];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            }
        }

        // --- STATE MANAGEMENT ---
        let selectedCharacter = CHARACTERS[0];
        let playerInfo = { grade: 3, classNum: 1, studentNum: 1, name: '' };
        let leaderboard = [];

        let canvas, ctx;
        let devicePixelRatio = window.devicePixelRatio || 1;
        let isPlaying = false;
        let animationFrameId = null;
        let score = 0; // Highest floor level reached
        let totalScore = 0;
        let energy = 100;
        let lastTime = 0;

        // PLATFORMER WORLD STATE
        let platforms = []; // Long stairs/floors
        let items = [];     // Quiz boxes & energy apples & moving obstacles
        let player = {
            x: 100,
            y: 0,
            vx: 0,
            vy: 0,
            width: 36,
            height: 36,
            isGrounded: false,
            facingRight: true,
            currentFloor: 0
        };

        let keys = {
            left: false,
            right: false,
            jump: false
        };

        let activeQuiz = null;
        let cameraY = 0;
        const STORAGE_KEY = 'safety_jump_leaderboard_v2';

        // --- INIT & EVENT LISTENERS ---
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            loadLeaderboard();
        });

        // Setup Cloud Sync Listener when Firebase is ready
        window.onCloudReady = function() {
            subscribeCloudLeaderboard();
        };

        function subscribeCloudLeaderboard() {
            if (!window.db) return;
            try {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((mod) => {
                    // Strict Rule 1 Path: artifacts/{appId}/public/data/leaderboard
                    const colRef = mod.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'leaderboard');
                    mod.onSnapshot(colRef, (snapshot) => {
                        const cloudList = [];
                        snapshot.forEach((doc) => {
                            cloudList.push(doc.data());
                        });
                        if (cloudList.length > 0) {
                            // Sort high scores
                            cloudList.sort((a, b) => b.stairs - a.stairs || b.score - a.score);
                            leaderboard = cloudList.slice(0, 30);
                            
                            const topScore = Math.max(...leaderboard.map(l => l.stairs || 0));
                            const hudHs = document.getElementById('hud-highscore');
                            if (hudHs) hudHs.textContent = `${topScore} 층`;

                            // Refresh UI if leaderboard modal open
                            if (!document.getElementById('leaderboard-modal').classList.contains('hidden')) {
                                renderLeaderboardList();
                            }
                        }
                    }, (err) => {
                        console.warn("Cloud sync listening notice:", err);
                    });
                });
            } catch(e) {
                console.warn("Cloud listener error:", e);
            }
        }

        function initApp() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            renderCharacterSelection();

            // Sound Toggle
            document.getElementById('btn-sound-toggle').addEventListener('click', () => {
                soundFX.muted = !soundFX.muted;
                document.getElementById('sound-icon').className = soundFX.muted 
                    ? 'fa-solid fa-volume-xmark text-slate-400' 
                    : 'fa-solid fa-volume-high text-emerald-600';
            });

            // Navigation Buttons
            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-rankings').addEventListener('click', () => showLeaderboard(true));
            document.getElementById('btn-close-rankings').addEventListener('click', () => showLeaderboard(false));
            document.getElementById('btn-close-rankings-bottom').addEventListener('click', () => showLeaderboard(false));
            document.getElementById('btn-restart').addEventListener('click', startGame);
            
            // Replay directly from rankings window
            document.getElementById('btn-restart-from-rankings').addEventListener('click', () => {
                showLeaderboard(false);
                startGame();
            });

            document.getElementById('btn-go-rankings').addEventListener('click', () => {
                document.getElementById('gameover-modal').classList.add('hidden');
                showLeaderboard(true);
            });

            // Touch Control Buttons for Walking & Jumping
            const btnLeft = document.getElementById('btn-walk-left');
            const btnRight = document.getElementById('btn-walk-right');
            const btnJump = document.getElementById('btn-jump-up');

            const bindTouch = (elem, keyName) => {
                const start = (e) => { e.preventDefault(); keys[keyName] = true; };
                const end = (e) => { e.preventDefault(); keys[keyName] = false; };
                elem.addEventListener('touchstart', start, { passive: false });
                elem.addEventListener('touchend', end, { passive: false });
                elem.addEventListener('mousedown', start);
                elem.addEventListener('mouseup', end);
                elem.addEventListener('mouseleave', end);
            };

            bindTouch(btnLeft, 'left');
            bindTouch(btnRight, 'right');
            
            // Jump triggers immediately on touch/click down
            const triggerJump = (e) => {
                e.preventDefault();
                doPlayerJump();
            };
            btnJump.addEventListener('touchstart', triggerJump, { passive: false });
            btnJump.addEventListener('mousedown', triggerJump);

            // Keyboard Controls (Walk Left/Right, Jump Up)
            window.addEventListener('keydown', (e) => {
                if (!isPlaying || activeQuiz) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                    if (!keys.jump) doPlayerJump();
                    keys.jump = true;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
            });

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        }

        function renderCharacterSelection() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';
            CHARACTERS.forEach((char) => {
                const isSelected = char.id === selectedCharacter.id;
                const card = document.createElement('div');
                card.className = `p-2.5 rounded-xl border-2 flex flex-col items-center justify-center cursor-pointer transition-all ${
                    isSelected ? 'border-amber-500 bg-amber-50 shadow-md scale-105' : 'border-slate-200 bg-white hover:border-amber-300'
                }`;
                card.innerHTML = `
                    <span class="text-2xl mb-1">${char.icon}</span>
                    <span class="text-[11px] font-bold text-slate-700">${char.name}</span>
                `;
                card.addEventListener('click', () => {
                    selectedCharacter = char;
                    renderCharacterSelection();
                });
                grid.appendChild(card);
            });
        }

        // --- HIGH-DPI CANVAS RESIZING (Sharp Crystal Quality) ---
        function resizeCanvas() {
            if (!canvas) return;
            const container = canvas.parentElement;
            const width = container.clientWidth;
            const height = container.clientHeight;

            devicePixelRatio = window.devicePixelRatio || 1;
            
            canvas.width = width * devicePixelRatio;
            canvas.height = height * devicePixelRatio;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx = canvas.getContext('2d');
            ctx.scale(devicePixelRatio, devicePixelRatio);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        }

        function getLogicalWidth() {
            return canvas.width / devicePixelRatio;
        }

        function getLogicalHeight() {
            return canvas.height / devicePixelRatio;
        }

        // --- PLATFORM & ITEM GENERATOR ---
        function generateWorld() {
            platforms = [];
            items = [];

            const floorHeightGap = 85;
            const floorWidth = getLogicalWidth() * 1.5;

            // Generate Upper Floors starting from Floor 1
            for (let f = 1; f <= 100; f++) {
                const floorY = (getLogicalHeight() - 80) - ((f - 1) * floorHeightGap);
                
                const pWidth = floorWidth * (0.8 + Math.random() * 0.2);
                const pX = (f % 2 === 0) ? 0 : (floorWidth - pWidth);

                platforms.push({
                    floor: f,
                    x: pX,
                    y: floorY,
                    width: pWidth,
                    height: 20
                });

                // Populate Frequently with Quizzes, Obstacles, and Food
                const itemSpacing = 160 + Math.random() * 80;
                for (let xPos = pX + 120; xPos < pX + pWidth - 80; xPos += itemSpacing) {
                    const rand = Math.random();
                    if (rand < 0.45) {
                        items.push({
                            type: 'quiz',
                            floor: f,
                            x: xPos,
                            y: floorY - 32,
                            width: 28,
                            height: 28,
                            active: true
                        });
                    } else if (rand < 0.75) {
                        const obsTypes = ['🚗', '🔥', '🐝', '🍌'];
                        items.push({
                            type: 'obstacle',
                            subType: obsTypes[Math.floor(Math.random() * obsTypes.length)],
                            floor: f,
                            x: xPos,
                            y: floorY - 26,
                            startX: xPos - 40,
                            endX: xPos + 40,
                            vx: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.5),
                            width: 26,
                            height: 26,
                            active: true
                        });
                    } else {
                        items.push({
                            type: 'apple',
                            floor: f,
                            x: xPos,
                            y: floorY - 26,
                            width: 24,
                            height: 24,
                            active: true
                        });
                    }
                }
            }
        }

        // --- GAMEPLAY CONTROL & LOOPS ---
        function startGame() {
            soundFX.init();
            const nameInput = document.getElementById('student-name').value.trim();
            if (!nameInput) {
                alert('학생 이름을 입력해주세요!');
                return;
            }

            playerInfo = {
                grade: document.getElementById('grade').value,
                classNum: document.getElementById('class-num').value,
                studentNum: document.getElementById('student-num').value,
                name: nameInput
            };

            document.getElementById('hud-avatar').textContent = selectedCharacter.icon;
            document.getElementById('hud-name').textContent = `${playerInfo.name} (${playerInfo.grade}-${playerInfo.classNum})`;
            document.getElementById('hud-stairs').textContent = '1';

            const topScore = leaderboard.length > 0 ? Math.max(...leaderboard.map(l => l.stairs || 1)) : 1;
            document.getElementById('hud-highscore').textContent = `${topScore} 층`;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            resizeCanvas();

            score = 1;
            totalScore = 0;
            energy = 100;

            generateWorld();

            // Reset Player on Floor 1
            player.x = 80;
            player.y = getLogicalHeight() - 130;
            player.vx = 0;
            player.vy = 0;
            player.isGrounded = false;
            player.currentFloor = 1;

            isPlaying = true;
            lastTime = performance.now();

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function doPlayerJump() {
            if (!isPlaying || activeQuiz) return;
            if (player.isGrounded) {
                player.vy = -8.8; 
                player.isGrounded = false;
                soundFX.playJump();
            }
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;

            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            const baseDrain = activeQuiz ? 6.5 : 3.5;
            energy -= baseDrain * dt;

            const energyBar = document.getElementById('energy-bar');
            const energyText = document.getElementById('energy-text');
            const currentEnergy = Math.max(0, Math.floor(energy));
            energyBar.style.width = `${currentEnergy}%`;
            energyText.textContent = `${currentEnergy}%`;

            if (energy <= 0) {
                if (activeQuiz) {
                    document.getElementById('quiz-modal').classList.add('hidden');
                    activeQuiz = null;
                }
                triggerGameOver();
                return;
            }

            if (!activeQuiz) {
                updatePhysics(dt);
            }

            const targetCamY = (getLogicalHeight() * 0.6) - player.y;
            cameraY += (targetCamY - cameraY) * 0.1;

            ctx.clearRect(0, 0, getLogicalWidth(), getLogicalHeight());
            drawBackground();

            ctx.save();
            ctx.translate(0, cameraY);

            drawPlatforms();
            updateAndDrawItems(dt);
            drawPlayer();

            ctx.restore();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function updatePhysics(dt) {
            const moveSpeed = 4.2;
            if (keys.left) {
                player.vx = -moveSpeed;
                player.facingRight = false;
            } else if (keys.right) {
                player.vx = moveSpeed;
                player.facingRight = true;
            } else {
                player.vx *= 0.7;
            }

            player.vy += 22 * dt; 

            player.x += player.vx;
            player.y += player.vy;

            const currentPlat = platforms.find(p => p.floor === player.currentFloor) || platforms[0];
            if (player.x < currentPlat.x) player.x = currentPlat.x;
            if (player.x + player.width > currentPlat.x + currentPlat.width) {
                player.x = currentPlat.x + currentPlat.width - player.width;
            }

            player.isGrounded = false;
            platforms.forEach(plat => {
                if (
                    player.x + player.width > plat.x &&
                    player.x < plat.x + plat.width &&
                    player.y + player.height >= plat.y &&
                    player.y + player.height <= plat.y + plat.height + 12 &&
                    player.vy >= 0
                ) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                    player.currentFloor = plat.floor;

                    if (plat.floor > score) {
                        score = plat.floor;
                        totalScore += 20;
                        document.getElementById('hud-stairs').textContent = score;
                    }
                }
            });
        }

        function updateAndDrawItems(dt) {
            items.forEach(item => {
                if (!item.active) return;

                if (item.type === 'obstacle') {
                    item.x += item.vx;
                    if (item.x < item.startX || item.x > item.endX) {
                        item.vx *= -1;
                    }
                }

                if (item.type === 'quiz') {
                    ctx.fillStyle = '#2563eb';
                    ctx.beginPath();
                    ctx.roundRect(item.x, item.y, item.width, item.height, 6);
                    ctx.fill();

                    ctx.font = '600 16px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('❓', item.x + item.width / 2, item.y + item.height / 2);
                } else if (item.type === 'obstacle') {
                    ctx.font = '600 22px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.subType, item.x + item.width / 2, item.y + item.height / 2);
                } else if (item.type === 'apple') {
                    ctx.font = '600 20px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🍎', item.x + item.width / 2, item.y + item.height / 2);
                }

                if (
                    player.x < item.x + item.width &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.height &&
                    player.y + player.height > item.y
                ) {
                    item.active = false;

                    if (item.type === 'quiz') {
                        triggerQuizModal();
                    } else if (item.type === 'obstacle') {
                        energy = Math.max(0, energy - 25);
                        soundFX.playWrong();
                    } else if (item.type === 'apple') {
                        energy = Math.min(100, energy + 20);
                        soundFX.playCorrect();
                    }
                }
            });
        }

        function drawPlatforms() {
            platforms.forEach(plat => {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.roundRect(plat.x + 3, plat.y + 4, plat.width, plat.height, 8);
                ctx.fill();

                const isEven = plat.floor % 2 === 0;
                ctx.fillStyle = isEven ? '#38bdf8' : '#f59e0b';
                ctx.strokeStyle = isEven ? '#0284c7' : '#d97706';
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.width, plat.height, 8);
                ctx.fill();
                ctx.stroke();

                ctx.font = 'bold 12px Pretendard, sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(` ${plat.floor}층 계단`, plat.x + 10, plat.y + plat.height / 2);
            });
        }

        function drawPlayer() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(player.x + player.width / 2, player.y + player.height - 2, 14, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Vector-styled crisp character renderer (prevents OS emoji raster blur)
            const cx = player.x + player.width / 2;
            const cy = player.y + player.height / 2 - 2;

            ctx.save();
            ctx.translate(cx, cy);

            // Face base
            ctx.fillStyle = '#fbbf24';
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Ears
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(-11, -12, 6, 0, Math.PI * 2);
            ctx.arc(11, -12, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Eyes
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(-5, -2, 2.5, 0, Math.PI * 2);
            ctx.arc(5, -2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye highlights
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6, -3, 1, 0, Math.PI * 2);
            ctx.arc(4, -3, 1, 0, Math.PI * 2);
            ctx.fill();

            // Snout/Cheeks
            ctx.fillStyle = '#fef3c7';
            ctx.beginPath();
            ctx.arc(0, 4, 5, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#78350f';
            ctx.beginPath();
            ctx.arc(0, 2, 2, 0, Math.PI * 2);
            ctx.fill();

            // Cheek blushes
            ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
            ctx.beginPath();
            ctx.arc(-10, 3, 3, 0, Math.PI * 2);
            ctx.arc(10, 3, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, getLogicalHeight());
            grad.addColorStop(0, '#38bdf8');
            grad.addColorStop(1, '#bae6fd');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, getLogicalWidth(), getLogicalHeight());
        }

        // --- QUIZ MODAL SYSTEM ---
        function triggerQuizModal() {
            const randomQuiz = QUIZ_BANK[Math.floor(Math.random() * QUIZ_BANK.length)];
            activeQuiz = randomQuiz;

            document.getElementById('quiz-category').innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${randomQuiz.category}`;
            document.getElementById('quiz-question').textContent = randomQuiz.question;

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.add('hidden');

            randomQuiz.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-100 hover:bg-sky-50 active:bg-sky-100 border border-slate-200 hover:border-sky-300 rounded-xl p-3 text-xs font-bold text-slate-700 transition-all flex items-center gap-2";
                btn.innerHTML = `<span class="w-5 h-5 rounded-full bg-white border border-slate-300 text-[10px] flex items-center justify-center font-black text-slate-500 flex-shrink-0">${idx+1}</span> <span>${opt}</span>`;
                
                btn.addEventListener('click', () => handleQuizAnswer(idx, btn));
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        function handleQuizAnswer(selectedIndex, clickedBtn) {
            const optionsBtns = document.querySelectorAll('#quiz-options button');
            optionsBtns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('quiz-feedback');
            feedback.classList.remove('hidden');

            if (selectedIndex === activeQuiz.answer) {
                soundFX.playCorrect();
                clickedBtn.classList.remove('bg-slate-100', 'border-slate-200');
                clickedBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                
                feedback.className = "mt-3 text-center text-xs font-bold py-2 rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-300";
                feedback.innerHTML = `<i class="fa-solid fa-circle-check"></i> 정답입니다! 에너지 +35% 충전!`;

                energy = Math.min(100, energy + 35);
                totalScore += 60;

                setTimeout(() => {
                    document.getElementById('quiz-modal').classList.add('hidden');
                    activeQuiz = null;
                }, 800);

            } else {
                soundFX.playWrong();
                clickedBtn.classList.remove('bg-slate-100', 'border-slate-200');
                clickedBtn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');

                optionsBtns[activeQuiz.answer].classList.remove('bg-slate-100');
                optionsBtns[activeQuiz.answer].classList.add('bg-emerald-50', 'border-emerald-400');

                feedback.className = "mt-3 text-center text-xs font-bold py-2 rounded-xl bg-red-100 text-red-800 border border-red-300";
                feedback.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 오답! 에너지가 20% 깎였습니다.`;

                energy = Math.max(0, energy - 20);

                setTimeout(() => {
                    document.getElementById('quiz-modal').classList.add('hidden');
                    activeQuiz = null;
                }, 1200);
            }
        }

        // --- GAME OVER & LEADERBOARD ---
        function triggerGameOver() {
            isPlaying = false;
            soundFX.playGameOver();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            document.getElementById('go-stairs').textContent = `${score} 층`;
            document.getElementById('go-score').textContent = `${totalScore} 점`;

            saveResult(playerInfo, score, totalScore, selectedCharacter);
            document.getElementById('gameover-modal').classList.remove('hidden');
        }

        // Save result locally AND sync to Firestore Cloud DB
        function saveResult(info, stairsCount, finalScore, char) {
            const docId = `record_${Date.now()}_${Math.floor(Math.random()*1000)}`;
            const entry = {
                id: docId,
                date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                student: `${info.grade}학년 ${info.classNum}반 ${info.studentNum}번 ${info.name}`,
                stairs: stairsCount,
                score: finalScore,
                charIcon: char.icon
            };

            // Local Memory Update
            leaderboard.push(entry);
            leaderboard.sort((a, b) => b.stairs - a.stairs || b.score - a.score);
            leaderboard = leaderboard.slice(0, 30);

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(leaderboard));
            } catch(e) {
                console.error("Local save error:", e);
            }

            // Sync to Firestore Cloud DB if connected
            if (window.db) {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((mod) => {
                    // Strict Rule 1 Path: /artifacts/{appId}/public/data/leaderboard/{docId}
                    const docRef = mod.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'leaderboard', docId);
                    mod.setDoc(docRef, entry).catch(err => console.warn("Cloud save error:", err));
                });
            }
        }

        function loadLeaderboard() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    leaderboard = JSON.parse(data);
                } else {
                    leaderboard = [];
                }
            } catch(e) {
                leaderboard = [];
            }
        }

        function showLeaderboard(show) {
            const modal = document.getElementById('leaderboard-modal');
            if (show) {
                renderLeaderboardList();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderLeaderboardList() {
            const container = document.getElementById('rankings-list');
            container.innerHTML = '';

            if (leaderboard.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs font-bold">
                        아직 등록된 기록이 없습니다.<br>첫 번째 주인공이 되어보세요!
                    </div>
                `;
                return;
            }

            leaderboard.forEach((item, index) => {
                const rank = index + 1;
                let rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-black text-xs flex items-center justify-center">${rank}</span>`;
                if (rank === 1) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-400 text-white font-black text-xs flex items-center justify-center shadow"><i class="fa-solid fa-crown text-xs"></i></span>`;
                if (rank === 2) rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-300 text-white font-black text-xs flex items-center justify-center shadow">2</span>`;
                if (rank === 3) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-600 text-white font-black text-xs flex items-center justify-center shadow">3</span>`;

                const row = document.createElement('div');
                row.className = `p-3 rounded-2xl flex items-center justify-between border ${
                    rank === 1 ? 'bg-amber-50/80 border-amber-200' : 'bg-slate-50 border-slate-100'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        ${rankBadge}
                        <span class="text-xl">${item.charIcon || '🐱'}</span>
                        <div>
                            <div class="text-xs font-bold text-slate-800">${item.student}</div>
                            <div class="text-[10px] text-slate-400">${item.date}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-black text-sky-600">${item.stairs} 층</div>
                        <div class="text-[10px] font-bold text-amber-500">${item.score} 점</div>
                    </div>
                `;
                container.appendChild(row);
            });
        }
    </script>
</body>
</html>
